server:
  host: "0.0.0.0"
  port: 18080

database:
  url: "sqlite:../data/ai-review.db"

scanner:
  interval_seconds: 60
  max_concurrent_tasks: 1
  max_diff_lines: 3000
  max_file_diff_lines: 800
  git_command_timeout_seconds: 120

git:
  command_path: "git"
  repo_base_dir: "../data/repos"

ai:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  timeout_seconds: 120
  temperature: 0.2
  max_tokens: 4096

mail:
  enabled: false
  smtp_host: ""
  smtp_port: 465
  username: ""
  password: ""
  from: "AI代码审核 <ai-review@example.com>"
  use_tls: true

review:
  default_prompt_name: "java_legacy"
  serious_levels:
    - "HIGH"
    - "CRITICAL"
  allowed_extensions:
    - ".java"
    - ".xml"
    - ".jsp"
    - ".js"
    - ".ts"
    - ".vue"
    - ".sql"
    - ".properties"
    - ".yml"
    - ".yaml"
  ignore_paths:
    - "target/"
    - "dist/"
    - "node_modules/"
    - ".git/"
    - "build/"
    - ".idea/"
  ignore_extensions:
    - ".class"
    - ".jar"
    - ".war"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".pdf"
    - ".xlsx"
    - ".docx"
    - ".min.js"
    - ".map"
    - ".lock"

