server:
  host: "0.0.0.0"
  port: 18080

database:
  url: "sqlite:../data/ai-review.db"

git:
  command_path: "git"
  repo_base_dir: "../data/repos"

# 首次启动时用于初始化“AI 设置”的默认值。
# 后续请在页面：AI 设置 中维护。
ai:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  timeout_seconds: 120
  temperature: 0.2
  max_tokens: 4096

